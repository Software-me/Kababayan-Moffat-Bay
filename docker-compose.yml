services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loreine
      POSTGRES_PASSWORD: loreine
      POSTGRES_DB: loreine_bay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loreine -d loreine_bay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
